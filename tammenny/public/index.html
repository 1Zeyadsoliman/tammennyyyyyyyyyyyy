<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>وصلت؟ طمّني</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#12302c;--mut:#5d7570;--pri:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--line:#dbe5e2}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a18;--card:#152623;--ink:#e6f2ef;--mut:#8fb0aa;--pri:#2dd4bf;--line:#244039}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;text-align:center}
@media(prefers-color-scheme:dark){header{color:#06231f}}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:600 14px inherit;font-family:inherit;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px inherit;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#06231f}}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.onway{background:#dbeafe;color:#1e40af}.arrived{background:#dcfce7;color:var(--ok)}.late{background:#fee2e2;color:var(--bad)}.silent{background:#fef3c7;color:var(--warn)}
.big{font-size:40px;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:13px}.center{text-align:center}
.alert{background:#fee2e2;color:var(--bad);border:1.5px solid var(--bad);border-radius:12px;padding:12px;font-weight:700;margin-bottom:12px;text-align:center}
svg.map{width:100%;height:180px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips span{background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:99px;font-size:13px}
ul{padding-inline-start:20px;margin:6px 0}.hide{display:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 0 24px}
</style>
</head>
<body>
<header><h1>وصلت؟ طمّني 🏠</h1><p>اطمن وطمنهم</p></header>
<nav id="tabs"><button data-t="go" class="on">رحلتي</button><button data-t="watch">متابعة</button><button data-t="news">كشف الأخبار</button></nav>
<main>
<!-- رحلتي -->
<section id="go">
  <div id="goForm" class="card">
    <label>اسمك</label><input id="name" placeholder="مثلاً: سارة" maxlength="40">
    <label>من</label><input id="from" placeholder="الجامعة">
    <label>إلى</label><input id="to" placeholder="البيت">
    <label>هوصل كمان كام دقيقة؟</label><input id="mins" type="number" inputmode="numeric" value="45" min="1">
    <button class="btn" onclick="startTrip()">ابدأ الرحلة وشارك الموقع</button>
    <p class="mut">الموقع بيتبعت بس طول الرحلة، وبيقف أول ما تدوس "وصلت".</p>
  </div>
  <div id="goLive" class="hide">
    <div class="card center"><span id="gStatus" class="pill onway"></span><div class="big" id="gCount">--:--</div>
      <div class="mut" id="gInfo"></div>
      <button class="btn" onclick="arrived()">✅ وصلت بالسلامة</button>
      <div class="row"><button class="btn sec" onclick="extend(10)">+10 دقايق</button><button class="btn sec" onclick="extend(20)">+20 دقيقة</button></div>
    </div>
    <div class="card"><b>لينك المتابعة</b>
      <input id="link" readonly onclick="this.select()" style="margin-top:8px">
      <div class="row"><button class="btn sec" onclick="shareLink()">مشاركة</button><button class="btn sec" onclick="copyLink()">نسخ</button></div>
    </div>
    <button class="btn sec" onclick="resetTrip()">رحلة جديدة</button>
  </div>
</section>

<!-- متابعة -->
<section id="watch" class="hide">
  <div id="wForm" class="card">
    <label>الصق لينك الرحلة أو الكود</label><input id="wcode" placeholder="مثلاً: a1b2c3d4">
    <button class="btn" onclick="openWatch()">تابع</button>
  </div>
  <div id="wView" class="hide">
    <div id="wAlert" class="alert hide"></div>
    <div class="card center"><div style="font-size:18px;font-weight:700" id="wName"></div><div class="mut" id="wRoute"></div>
      <div style="margin:10px 0"><span id="wStatus" class="pill"></span></div>
      <div class="big" id="wCount">--:--</div><div class="mut" id="wInfo"></div>
    </div>
    <div class="card"><svg id="wMap" class="map" viewBox="0 0 300 180"></svg>
      <a id="wGmaps" class="btn sec" style="text-decoration:none;text-align:center" target="_blank" rel="noopener">افتح آخر موقع في الخرائط</a></div>
    <button class="btn sec" onclick="askNotif()">🔔 فعّل التنبيهات</button>
    <button class="btn sec" onclick="stopWatch()">رجوع</button>
  </div>
</section>

<!-- أخبار -->
<section id="news" class="hide">
  <div class="card"><label>الصق الخبر أو الرسالة اللي وصلتك</label>
    <textarea id="ntext" placeholder="مثلاً: عاجل!! مصدر مؤكد بيقول إن... شير قبل ما يتحذف"></textarea>
    <button class="btn" id="nbtn" onclick="checkNews()">افحص الخبر 🔍</button></div>
  <div id="nres" class="card hide"></div>
</section>
</main>
<footer>وصلت؟ طمّني • اطمن وطمنهم</footer>

<script>
const $=id=>document.getElementById(id);
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:b?JSON.stringify(b):undefined});let d;try{d=await r.json()}catch{throw new Error('السيرفر رد بشكل غير متوقع، تأكد إن node server.js شغال')}if(!r.ok)throw new Error(d.error||'حصل خطأ');return d};
const ST={onway:'في الطريق 🚶',arrived:'وصل بالسلامة ✅',late:'اتأخر ⚠️',silent:'الإشارة مقطوعة 📡'};
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const ago=t=>{if(!t)return'لسه مفيش موقع';const m=Math.round((Date.now()-t)/60000);return m<1?'آخر تحديث: دلوقتي':'آخر تحديث: من '+m+' دقيقة'};

// تابات
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));['go','watch','news'].forEach(s=>$(s).classList.toggle('hide',s!==t))}

// ---------- رحلتي ----------
let trip=JSON.parse(localStorage.getItem('trip')||'null'),geoId=null,lastSent=0,wake=null,tick=null,poll=null,eta=0;
async function startTrip(){
  const name=$('name').value.trim(),mins=+$('mins').value;
  if(!name||!mins)return alert('اكتب اسمك ووقت الوصول');
  try{const r=await api('/trips','POST',{name,from:$('from').value,to:$('to').value,etaMinutes:mins});
    trip={...r};localStorage.setItem('trip',JSON.stringify(trip));runTrip()}catch(e){alert(e.message)}
}
async function runTrip(){
  $('goForm').classList.add('hide');$('goLive').classList.remove('hide');
  $('link').value=location.origin+'/t/'+trip.id;
  if('geolocation'in navigator){
    geoId=navigator.geolocation.watchPosition(p=>{const n=Date.now();if(n-lastSent<15000)return;lastSent=n;
      api(`/trips/${trip.id}/location`,'POST',{token:trip.token,lat:p.coords.latitude,lng:p.coords.longitude}).catch(()=>{})},
      e=>{$('gInfo').textContent='⚠️ فعّل إذن الموقع عشان أهلك يشوفوك'},{enableHighAccuracy:true,maximumAge:5000});
  }else $('gInfo').textContent='المتصفح مش بيدعم تحديد الموقع';
  try{wake=await navigator.wakeLock?.request('screen')}catch{}
  const refresh=async()=>{try{const v=await api('/trips/'+trip.id);eta=v.eta;const s=$('gStatus');s.className='pill '+v.status;s.textContent=ST[v.status];
    if(v.status==='arrived')finishLocal();$('gInfo').textContent=v.status==='late'?`متأخر ${v.lateMinutes} دقيقة - عدّل الوقت لو محتاج`:ago(v.last&&v.last.t)}catch{}};
  refresh();poll=setInterval(refresh,15000);
  tick=setInterval(()=>{const d=eta-Date.now();$('gCount').textContent=(d<0?'-':'')+mmss(Math.abs(d))},1000);
}
function finishLocal(){navigator.geolocation.clearWatch(geoId);clearInterval(tick);clearInterval(poll);wake?.release?.()}
async function arrived(){await api(`/trips/${trip.id}/arrived`,'POST',{token:trip.token});finishLocal();$('gCount').textContent='🎉';$('gStatus').className='pill arrived';$('gStatus').textContent=ST.arrived}
async function extend(m){await api(`/trips/${trip.id}/extend`,'POST',{token:trip.token,minutes:m})}
function resetTrip(){if(geoId!=null)finishLocal();localStorage.removeItem('trip');trip=null;location.href='/'}
function copyLink(){navigator.clipboard?.writeText($('link').value);alert('اتنسخ')}
function shareLink(){const t=`تابع رحلتي لحد ما أوصل 🏠`;navigator.share?navigator.share({title:'وصلت؟ طمّني',text:t,url:$('link').value}):copyLink()}

// ---------- متابعة ----------
let wid=null,wpoll=null,wtick=null,weta=0,lastStatus=null;
function openWatch(){const v=$('wcode').value.trim().split('/').pop();if(v)location.href='/t/'+v}
function stopWatch(){location.href='/'}
function askNotif(){Notification?.requestPermission?.().then(p=>alert(p==='granted'?'تمام، هنبعتلك تنبيه لو حصل تأخير':'التنبيهات مقفولة من المتصفح'))}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),600);navigator.vibrate?.([300,150,300])}catch{}}
function drawMap(pts){const s=$('wMap');if(!pts.length){s.innerHTML='<text x="150" y="95" text-anchor="middle" fill="#888" font-size="13">مستني أول موقع...</text>';return}
  const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lng),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),sp=Math.max(b-a,d-c,.002);
  const X=v=>20+(v-c)/sp*260+(260-(d-c)/sp*260)/2,Y=v=>160-((v-a)/sp*140)-(140-(b-a)/sp*140)/2;
  const path=pts.map(p=>X(p.lng).toFixed(1)+','+Y(p.lat).toFixed(1)).join(' '),l=pts[pts.length-1];
  s.innerHTML=`<polyline points="${path}" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(l.lng)}" cy="${Y(l.lat)}" r="8" fill="#0f766e" opacity=".3"/><circle cx="${X(l.lng)}" cy="${Y(l.lat)}" r="5" fill="#0f766e"/>`}
async function watchLoop(){
  try{const v=await api('/trips/'+wid);weta=v.eta;
    $('wName').textContent=v.name;$('wRoute').textContent=[v.from,v.to].filter(Boolean).join(' ← ');
    const s=$('wStatus');s.className='pill '+v.status;s.textContent=ST[v.status];
    $('wInfo').textContent=v.status==='arrived'?'وصل الساعة '+new Date(v.arrivedAt).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):ago(v.last&&v.last.t);
    const al=$('wAlert');al.classList.toggle('hide',!(v.status==='late'||v.status==='silent'));
    al.textContent=v.status==='late'?`⚠️ ${v.name} اتأخر ${v.lateMinutes} دقيقة عن الميعاد. جرّب تكلمه.`:'📡 مفيش تحديث للموقع بقاله فترة. اتصل بيه تتطمن.';
    drawMap(v.points);if(v.last)$('wGmaps').href=`https://www.google.com/maps?q=${v.last.lat},${v.last.lng}`;else $('wGmaps').classList.add('hide');
    if(lastStatus&&lastStatus!==v.status&&(v.status==='late'||v.status==='silent')){beep();if(Notification?.permission==='granted')new Notification('وصلت؟ طمّني',{body:al.textContent})}
    if(lastStatus&&lastStatus!==v.status&&v.status==='arrived'){beep();if(Notification?.permission==='granted')new Notification('وصلت؟ طمّني',{body:v.name+' وصل بالسلامة ✅'})}
    lastStatus=v.status;if(v.status==='arrived'){$('wCount').textContent='🎉';clearInterval(wtick)}
  }catch(e){$('wRoute').textContent=e.message}
}
function startWatch(id){wid=id;show('watch');$('wForm').classList.add('hide');$('wView').classList.remove('hide');
  watchLoop();wpoll=setInterval(watchLoop,10000);
  wtick=setInterval(()=>{const d=weta-Date.now();$('wCount').textContent=(d<0?'-':'')+mmss(Math.abs(d))},1000)}

// ---------- أخبار ----------
async function checkNews(){
  const t=$('ntext').value.trim();if(t.length<10)return alert('اكتب الخبر الأول');
  const b=$('nbtn');b.disabled=true;b.textContent='بنفحص...';
  try{const r=await api('/factcheck','POST',{text:t});const bad=/كاذب|مشكوك/.test(r.verdict),mid=/تحقق|لا يمكن/.test(r.verdict);
    const col=bad?'var(--bad)':mid?'var(--warn)':'var(--ok)';
    const li=a=>'<ul>'+(a||[]).map(x=>`<li>${x.replace(/</g,'&lt;')}</li>`).join('')+'</ul>';
    const n=$('nres');n.classList.remove('hide');
    n.innerHTML=`<div style="font-size:20px;font-weight:800;color:${col}">${r.verdict}</div><div class="mut">نسبة الثقة: ${r.confidence}%</div><b>ليه؟</b>${li(r.reasons)}<b>اتأكد إزاي؟</b>${li(r.tips)}<p class="mut">${r.note||''}</p>`}
  catch(e){alert(e.message)}b.disabled=false;b.textContent='افحص الخبر 🔍'}

// ---------- تشغيل ----------
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const m=location.pathname.match(/^\/t\/(\w+)/);
if(m)startWatch(m[1]);else if(trip)runTrip();
</script>
</body>
</html>
